name: pr

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    permissions:
      security-events: write
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0

  build_unbound:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - id: image
      run: |
        IMAGE_NAME=$(uuidgen)
        echo "name=ttl.sh/${IMAGE_NAME}:1h" >> $GITHUB_OUTPUT
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .docker/unbound/rootfs
        push: true
        tags: ${{ steps.image.outputs.name }}
      env:
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: false
    - if: github.event.pull_request.head.repo.full_name == github.repository
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - if: github.event.pull_request.head.repo.full_name == github.repository
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .docker/unbound/rootfs
        push: true
        tags: ghcr.io/luzilla/unbound:dev
      env:
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: false

  test:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go-version:
          - 1.26.x
          - 1.27.x
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: false
    - run: go test -v --race ./...

  release_test:
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - run: docker buildx ls
    - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
      with:
        version: '~> v2'
        args: release --snapshot --clean
    - id: version
      run: |
        version=$(jq -r '.tag | ltrimstr("v")' dist/metadata.json)
        echo "version=${version}" >> $GITHUB_OUTPUT
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/
        retention-days: 1
        if-no-files-found: error

  package_test:
    needs: release_test
    name: package-${{ matrix.target }}-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - mariner2/rpm
          - bookworm/deb
          - azlinux3/testing/sysext
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - id: dalec
        uses: ./.github/actions/run-dalec
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.release_test.outputs.version }}
          build-directory: ./dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dalec.outputs.artifact }}
          path: ${{ steps.dalec.outputs.output-path }}
          retention-days: 2
          if-no-files-found: error

  smoke_test_ubuntu:
    needs: package_test
    runs-on: ${{ matrix.runner }}
    permissions: {}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "dnsbl-exporter_*${{ matrix.arch }}.deb"
          merge-multiple: true
      - env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo apt update -y
          sudo apt install -y ./dnsbl-exporter_*${ARCH}.deb
      - name: test install
        run: |
          command -v dnsbl-exporter
          dnsbl-exporter -h
      - name: test user/group
        run: |
          getent passwd dnsbl-exporter
          getent group  dnsbl-exporter
      - name: test service
        run: |
          systemctl cat dnsbl-exporter.service
      - name: test config files
        run: |
          test -f /etc/dnsbl-exporter/rbls.ini
          test -f /etc/dnsbl-exporter/rbls-domain.ini
          test -f /etc/dnsbl-exporter/targets.ini

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - release_test
    services:
      unbound:
        image: ghcr.io/luzilla/unbound:v0.10.0
        ports:
        - 5053:5053/tcp
        - 5053:5053/udp
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: dist
        path: ./dist/
    - run: ls -R ./dist
    - env:
        BINARY: ./dist/dnsbl_exporter_linux_amd64_v1/dnsbl-exporter
      run: |
        chmod +x ${BINARY}
        ${BINARY} \
          --log.debug \
          --config.dns-resolver=localhost:5053 > dnsbl.log 2>&1 &
        echo $! > dnsbl_exporter.pid

        pid=`cat dnsbl_exporter.pid`
        echo "✅ started dnsbl-exporter: ${pid}" >> $GITHUB_STEP_SUMMARY
    - run: |
        timeout 60 bash -c 'until curl -f http://localhost:9211/; do sleep 1; done'
        echo "✅ dnsbl-exporter has started" >> $GITHUB_STEP_SUMMARY
    - name: test metrics
      run: |
        timeout 10 curl -f http://localhost:9211/metrics
    - name: test prober
      run: |
        timeout 10 curl -f http://localhost:9211/prober?target=github.com
    - name: Show logs if failed
      if: failure()
      run: |
        echo "=== dnsbl-exporter logs ==="
        cat dnsbl.log || echo "No log file found"
    - if: always()
      run: |
        if [ -f dnsbl_exporter.pid ]; then
          kill $(cat dnsbl_exporter.pid) || true
        fi

  freebsd:
    needs:
      - check
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        version:
          - "15.0"
          - "14.3"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: test
      uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
      with:
        release: ${{ matrix.version }}
        copyback: false
        sync: no
        run: uname -a
    - name: install build dependencies
      shell: freebsd {0}
      run: |
        pkg install -y \
          lang/go \
          git-lite \
          devel/goreleaser \
          sysutils/helm
    - name: download source
      shell: freebsd {0}
      run: git clone https://github.com/${{ github.repository }}
    - name: build
      shell: freebsd {0}
      run: |
        cd dnsbl_exporter && \
        goreleaser build \
          --single-target \
          --snapshot \
          --clean
    - shell: freebsd {0}
      run: |
        cd dnsbl_exporter && \
        ./dist/dnsbl_exporter_freebsd_amd64_v1/dnsbl-exporter -h
