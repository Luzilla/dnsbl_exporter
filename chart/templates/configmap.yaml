apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dnsbl-exporter.fullname" . }}
  labels:
    {{- include "dnsbl-exporter.labels" . | nindent 4 }}
data:
  targets.ini: |-
    [targets]
    {{- range $value := .Values.config.targets }}
    server={{ $value }}
    {{- end }}
  rbls.ini: |-
    [rbl]
    {{- range $value := .Values.config.rbls }}
    server={{ $value }}
    {{- end }}
  {{- if .Values.config.rbls_domain }}
  rbls-domain.ini: |-
    [rbl]
    {{- range $value := .Values.config.rbls_domain }}
    server={{ $value }}
    {{- end }}
  {{- end }}
  {{- if .Values.config.targets_domain }}
  targets-domain.ini: |-
    [targets]
    {{- range $value := .Values.config.targets_domain }}
    server={{ $value }}
    {{- end }}
  {{- end }}
